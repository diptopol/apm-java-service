server:
  port: 8091
spring:
  application:
    name: service-a

  cloud:
    consul:
      discovery:
        enabled: true
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        hostname: localhost
      host: localhost
      port: 8500
