server:
  port: 8090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: service-a
          uri: lb://service-a/
          predicates:
            - Path=/service-a/**
        - id: service-b
          uri: lb://service-b/
          predicates:
            - Path=/service-b/**
    consul:
      discovery:
        enabled: true
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${random.value}
        hostname: localhost
        health-check-path: /actuator/health
      host: localhost
      port: 8500
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG